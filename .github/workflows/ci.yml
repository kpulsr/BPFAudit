name: LKM-CI
on: [push, pull_request]

env:
  MODULE: bpfledger
  FAIL_RE: "BUG:|WARNING:|KASAN:|UBSAN:|general protection fault|RCU stall"
  KERNEL_DEB: "https://kernel.ubuntu.com/mainline/v6.17/amd64/linux-image-unsigned-6.17.0-061700-generic_6.17.0-061700.202509282239_amd64.deb"

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read

jobs:
  static:
    name: Sparse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sparse
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential sparse linux-headers-$(uname -r)
      - run: make C=1 CHECK=sparse -C ledger

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential linux-headers-$(uname -r)
      - run: make CC=gcc -j$(nproc) -C ledger
      - uses: actions/upload-artifact@v4
        with:
          name: ko-gcc
          path: ledger/build/bpfledger.ko
          if-no-files-found: error

  qemu:
    name: QEMU
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ko-gcc
          path: ledger/build/

      - name: Install QEMU deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 wget cpio gzip keyutils

      - name: Fetch mainline kernel (6.8.12)
        run: |
          wget -q "$KERNEL_DEB"
          dpkg-deb -x linux-image-*.deb kpkg/
          cp kpkg/boot/vmlinuz-* vmlinuz

      - name: Build initrd
        run: |
          mkdir -p r/{bin,dev,proc,sys,lib/modules}
          cp ledger/build/bpfledger.ko r/lib/modules/
          printf '%032d' 0 > r/hmackey

          cat > r/init << 'EOF'
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs none /dev
          keyctl padd logon bpfaudit:hmac @s < /hmackey
          echo "=== lifecycle 50x ==="
          for i in $(seq 1 50); do
            insmod /lib/modules/bpfledger.ko && rmmod bpfledger || echo "cycle $i failed"
          done
          echo "=== failslab ==="
          if [ -d /sys/kernel/debug/failslab ]; then
            echo 1  > /sys/kernel/debug/failslab/ignore-gfp-wait
            echo 10 > /sys/kernel/debug/failslab/probability
            echo 50 > /sys/kernel/debug/failslab/times
            for i in $(seq 1 30); do
              insmod /lib/modules/bpfledger.ko 2>/dev/null || true
              rmmod bpfledger 2>/dev/null || true
            done
            echo 0 > /sys/kernel/debug/failslab/probability
          else
            echo "failslab unavailable"
          fi
          echo "=== read-path fuzz ==="
          insmod /lib/modules/bpfledger.ko
          i=0; while [ $i -lt 100 ]; do
            dd if=/dev/bpfledger bs=152 count=1 of=/dev/null 2>/dev/null &
            dd if=/dev/bpfledger bs=1   count=8 of=/dev/null 2>/dev/null &
            i=$((i+1))
          done
          wait
          rmmod bpfledger
          echo "=== dmesg ==="
          dmesg
          poweroff -f
          EOF

          chmod +x r/init
          (cd r && find . -print0 | cpio --null -H newc -o | gzip > ../initrd)

      - name: Boot (120s timeout)
        timeout-minutes: 3
        run: |
          timeout 120s qemu-system-x86_64 \
            -m 512 \
            -kernel vmlinuz \
            -initrd initrd \
            -nographic \
            -no-reboot \
            -append "console=ttyS0 nokaslr panic=5" \
            | tee qemu.log || true

      - name: Check log for errors
        run: |
          if grep -E "$FAIL_RE" qemu.log; then
            echo "::error::Found forbidden pattern in QEMU log"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-log
          path: qemu.log
          if-no-files-found: ignore
